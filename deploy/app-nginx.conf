server {
    listen 80;
    server_name _;
    client_max_body_size 55m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve the Play Store policy at the exact submitted HTTPS URL. Handling
    # the file here avoids nginx's automatic directory-slash redirect, whose
    # scheme would otherwise reflect this container's internal HTTP hop.
    location = /privacy {
        try_files /privacy/index.html =404;
    }

    # 独立 App 下载页（mobile-app/public/download/），分享链接 https://app.openbible.live/download
    location = /download {
        add_header Cache-Control "no-cache";
        try_files /download/index.html =404;
    }

    # Account API lives in the admin app; proxying keeps the session cookie
    # first-party for this origin. The variable + resolver make nginx re-resolve
    # the container name instead of pinning its IP at startup.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $admin_upstream http://ob-cn-admin:3000;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A first Huidu response includes RAG retrieval, reranking and Qwen
        # generation. Keep the proxy open long enough for that pipeline.
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        # Huidu uses NDJSON streaming. Forward each generated chunk instead of
        # waiting for nginx to fill its proxy buffer.
        proxy_buffering off;
        proxy_cache off;
    }

    # App 安装包（仓库 downloads/ 目录挂载进来，见 docker-compose 与 downloads/README.md）。
    # 文件名固定（openbible-android.apk），换版本即覆盖文件：缓存走协商（no-cache + ETag），
    # 不能长缓存，否则用户扫码拿到旧版。找不到文件就 404，不回退到单页应用的 index.html。
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
